name: Build APK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pick Gradle version
        id: gv
        run: |
          f=gradle/wrapper/gradle-wrapper.properties
          if [ -f "$f" ]; then
            v=$(grep distributionUrl "$f" | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')
          else
            v=8.10.2
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.v }}

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tsek.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tsek-apk
          path: tsek.apk

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: tsek.apk
